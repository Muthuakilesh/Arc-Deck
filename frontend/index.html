<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover + the safe-area vars keep the dock off the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

    <title>ArcDeck</title>

    <meta name="theme-color" content="#05070f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ArcDeck">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./images/ui/apple-touch-icon.png">

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/themes.css">
</head>

<body>
    <div id="splash">
        <div class="splash-logo">&#9672;</div>
        <h1>ArcDeck</h1>
    </div>

    <div id="arcdeck">
        <div id="wallpaper-layer"></div>
        <div id="gradient-layer"></div>

        <header id="topbar"></header>
        <main id="app-view"></main>
        <nav id="dock"></nav>
    </div>

    <div id="toast-container"></div>

    <!-- Served from the PC: the phone often has no internet on the LAN the deck runs on. -->
    <script src="./vendor/socket.io.min.js"></script>
    <script type="module" src="./js/main.js?v=10"></script>
</body>

</html>
